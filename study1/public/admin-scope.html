<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Norm Pilot Admin</title><link rel="stylesheet" href="/css/style.css"><style>
body{background:#f3f6fa}.admin{max-width:1200px;margin:2rem auto;padding:0 1rem}.scope-nav{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}.scope-nav a{padding:.55rem .8rem;background:white;border:1px solid #d7deea;border-radius:.5rem;text-decoration:none}.scope-nav a.active{background:#183a63;color:white}.matrix,.records{width:100%;border-collapse:collapse}.matrix th,.matrix td,.records th,.records td{border:1px solid #d7deea;padding:.65rem;text-align:center}.matrix th:first-child,.records td{text-align:left}.cell-count{font-size:1.6rem;font-weight:700}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:1rem}.detail{white-space:pre-wrap;overflow:auto;max-height:34rem;background:#101827;color:#eef5ff;padding:1rem;border-radius:.6rem}
</style></head><body><main class="admin"><nav class="scope-nav"><a href="/admin/formal" data-scope="formal">Formal</a><a href="/admin/preview" data-scope="preview">Preview</a><a href="/admin/qa" data-scope="qa">QA</a><a href="/admin/team-review" data-scope="team-review">Team Review</a></nav>
<section class="card"><div class="toolbar"><div><p class="eyebrow" id="scope-label"></p><h1>AI Norm Pilot v1</h1></div><button class="btn btn-secondary" id="export">Download isolated bundle</button></div><p>This page and its API are locked to one persistent scope.</p></section>
<section class="card"><h2>Norm Type × Norm Valence</h2><table class="matrix"><thead><tr><th>Norm Type \ Norm Valence</th><th>Honest</th><th>Pro-misreport</th></tr></thead><tbody id="matrix"></tbody></table></section>
<section class="card"><h2>Participants</h2><div style="overflow:auto"><table class="records"><thead><tr><th>Session</th><th>Condition</th><th>Norm Type</th><th>Norm Valence</th><th>Status</th><th>Rounds</th><th>Inspect</th></tr></thead><tbody id="records"></tbody></table></div></section>
<section class="card"><h2>Participant detail</h2><pre class="detail" id="detail">Select a participant.</pre></section><p id="error" class="error-box" hidden></p></main>
<script>
const pathScope=location.pathname.split("/").filter(Boolean).at(-1);const apiScope=pathScope;let token=sessionStorage.getItem("normPilotAdminToken")||"";
document.querySelector(`[data-scope="${pathScope}"]`)?.classList.add("active");document.querySelector("#scope-label").textContent=pathScope.replace("-"," ").toUpperCase();
async function api(path){let r=await fetch(path,{headers:{"x-admin-token":token}});if(r.status===401){token=prompt("Admin token")||"";sessionStorage.setItem("normPilotAdminToken",token);r=await fetch(path,{headers:{"x-admin-token":token}});}if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||`HTTP ${r.status}`);return r;}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function load(){try{const d=await(await api(`/api/admin/scope/${apiScope}/summary`)).json();const by=new Map(d.matrix.map(x=>[`${x.norm_type}|${x.norm_valence}`,x]));document.querySelector("#matrix").innerHTML=["injunctive","subjective"].map(t=>`<tr><th>${t[0].toUpperCase()+t.slice(1)}</th>${["honest","pro_misreport"].map(v=>{const x=by.get(`${t}|${v}`)||{};return `<td><div>${esc(x.condition)}</div><div class="cell-count">${x.arrived||0}</div><small>${x.completed||0} completed</small></td>`}).join("")}</tr>`).join("");document.querySelector("#records").innerHTML=d.participants.map(x=>`<tr><td>${esc(x.record_id)}</td><td>${esc(x.condition)}</td><td>${esc(x.norm_type)}</td><td>${esc(x.norm_valence)}</td><td>${esc(x.status)}</td><td>${esc(x.rounds_completed)}</td><td><button class="btn btn-secondary" data-id="${esc(x.record_id)}">Inspect</button></td></tr>`).join("")||'<tr><td colspan="7">No records in this scope.</td></tr>'; }catch(e){const x=document.querySelector("#error");x.hidden=false;x.textContent=e.message;}}
document.addEventListener("click",async e=>{const b=e.target.closest("button[data-id]");if(!b)return;const d=await(await api(`/api/admin/scope/${apiScope}/session/${encodeURIComponent(b.dataset.id)}`)).json();document.querySelector("#detail").textContent=JSON.stringify(d,null,2);});
document.querySelector("#export").onclick=async()=>{const r=await api(`/api/admin/scope/${apiScope}/export.zip`);const blob=await r.blob();const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(r.headers.get("content-disposition")?.match(/filename="([^"]+)/)||[])[1]||"export.zip";a.click();URL.revokeObjectURL(a.href);};load();
</script></body></html>
