<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study 1 Human-AI QA Preview</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="admin-page"><section class="panel"><div class="section-kicker">Authenticated Researcher QA</div><h1>Study 1 Human-AI Peer Influence v1</h1><p>Select any of the 14 code-supported QA cells. Escalating is legacy-only and is not recruited.</p>
<label class="field-label" for="identity">Peer identity</label><select id="identity" class="text-input"><option value="human">Human</option><option value="ai">AI</option></select>
<label class="field-label" for="condition">Condition</label><select id="condition" class="text-input"><option value="hidden">Hidden</option><option value="honest">Honest</option><option value="dishonest_fixed_1">Fixed-1</option><option value="dishonest_fixed_2">Fixed-2</option><option value="dishonest_fixed_3">Fixed-3</option><option value="dishonest">All-Dishonest</option><option value="dishonest_escalating">Escalating — LEGACY / NOT RECRUITED</option></select>
<button id="create" class="primary-button">Create synthetic QA session</button><p id="result" role="status"></p></section></main>
<script>document.querySelector("#create").addEventListener("click",async()=>{const response=await fetch("/api/admin/qa/session",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({peer_identity:document.querySelector("#identity").value,condition:document.querySelector("#condition").value})});const data=await response.json();if(!response.ok){document.querySelector("#result").textContent=data.error||"QA unavailable";return;}location.href=`/en/?qa_session=${encodeURIComponent(data.session.id)}`;});</script></body></html>
