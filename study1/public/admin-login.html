<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Norm Pilot Admin Login</title><link rel="stylesheet" href="/css/style.css"></head><body><main id="app"><section class="screen active"><form class="card hero" id="login"><p class="eyebrow">RESEARCHER ADMIN</p><h1>AI Norm Pilot</h1><p class="subtitle">Sign in with the administrator password.</p><label>Admin password<input class="text-input" id="password" type="password" autocomplete="current-password" required></label><div class="hero-actions"><button class="btn btn-primary btn-lg" type="submit">Sign in</button></div><p id="error" class="error-box" hidden></p></form></section></main><script>
const next=new URLSearchParams(location.search).get("next")||"/admin/formal";document.querySelector("#login").addEventListener("submit",async e=>{e.preventDefault();const error=document.querySelector("#error");error.hidden=true;const r=await fetch("/api/admin/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:document.querySelector("#password").value,next})});const d=await r.json().catch(()=>({}));if(r.ok)location.replace(d.next||"/admin/formal");else{error.textContent=d.error||"Sign-in failed.";error.hidden=false;}});
</script></body></html>
