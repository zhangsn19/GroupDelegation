<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Norm Pilot Preview</title><link rel="stylesheet" href="/css/style.css"><style>.matrix{width:100%;border-collapse:collapse}.matrix th,.matrix td{border:1px solid #d9e0ea;padding:1rem;text-align:center}.matrix th:first-child{text-align:left}.matrix .btn{width:100%}</style></head><body><main id="app"><section class="screen active"><div class="card hero"><p class="eyebrow">PREVIEW · NON-PRODUCTION</p><h1>AI Norm Pilot Preview</h1><table class="matrix"><thead><tr><th>Norm Type \ Norm Valence</th><th>Honest</th><th>Pro-misreport</th></tr></thead><tbody><tr><th>Injunctive</th><td><button class="btn btn-primary" data-condition="injunctive_honest">Preview IH</button></td><td><button class="btn btn-primary" data-condition="injunctive_misreport">Preview IM</button></td></tr><tr><th>Subjective</th><td><button class="btn btn-primary" data-condition="subjective_honest">Preview SH</button></td><td><button class="btn btn-primary" data-condition="subjective_misreport">Preview SM</button></td></tr></tbody></table><p id="result" class="status-hint"></p></div></section></main><script>document.addEventListener("click",async(e)=>{const b=e.target.closest("button[data-condition]");if(!b)return;b.disabled=true;try{const r=await fetch("/api/preview/session",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({condition:b.dataset.condition})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Preview unavailable");location.href=`/en/?preview_session=${encodeURIComponent(d.session.id)}`;}catch(x){document.querySelector("#result").textContent=x.message;b.disabled=false;}});</script></body></html>
