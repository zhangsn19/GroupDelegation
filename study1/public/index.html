<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>实验一：骰子结果申报任务</title>
    <link rel="stylesheet" href="/css/style.css">
  </head>
  <body>
    <div id="app">
      <section id="screen-landing" class="screen active">
        <div class="card hero">
          <h1>实验一：骰子结果申报任务</h1>
          <p class="subtitle">请根据系统展示的共同骰子结果，完成个人报告。</p>
          <div class="hero-actions">
            <button class="btn btn-primary btn-lg" id="btn-start">
              <span class="btn-title">开始参与</span>
              <span class="btn-desc">进入模拟同事群体</span>
            </button>
          </div>
        </div>
      </section>

      <section id="screen-consent" class="screen">
        <div class="card">
          <h2>知情同意</h2>
          <div class="consent-text">
            <p>你将进入一个模拟同事群体，并与其他成员通过共享群聊 AI 完成个人报告任务。</p>
            <ul>
              <li>你的个人报告不会向其他成员展示。</li>
              <li>完成全部流程后，你将获得基础参与报酬；此外，任务报酬将根据页面所示规则另行计算。最终被试费由基础参与报酬和任务报酬两部分构成。</li>
              <li>你可以随时停止参与。</li>
            </ul>
          </div>
          <label class="consent-check">
            <input type="checkbox" id="consent-check">
            <span>我已阅读以上信息，并同意继续参与。</span>
          </label>
          <div class="btn-row">
            <button class="btn btn-secondary" id="btn-consent-decline">退出</button>
            <button class="btn btn-primary" id="btn-consent-agree" disabled>我同意参加</button>
          </div>
        </div>
      </section>

      <section id="screen-experiment" class="screen">
        <header class="top-bar">
          <span id="exp-title" class="exp-title">团队报告与决策研究</span>
          <span id="phase-indicator" class="phase-badge"></span>
        </header>
        <main id="experiment-content"></main>
      </section>

      <section id="screen-complete" class="screen">
        <div class="card">
          <p class="eyebrow">完成</p>
          <h2>已完成</h2>
          <p class="thank-you">感谢你的参与。请妥善保存你的参与编号，以便后续查询、撤回本次参与或申请删除本次记录。</p>
        </div>
      </section>
    </div>

    <script src="/js/survey.js"></script>
    <script src="/js/chat.js"></script>
    <script src="/js/comprehension.js"></script>
    <script src="/js/study1-dice.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
