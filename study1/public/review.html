<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Norm Pilot Team Review</title><link rel="stylesheet" href="/css/style.css">
<style>.matrix{width:100%;border-collapse:collapse}.matrix th,.matrix td{border:1px solid #d9e0ea;padding:1rem;text-align:center}.matrix th:first-child{text-align:left}.matrix .btn{width:100%}</style></head>
<template id="legacy-regression-markers">Study 1 Human–AI Review · Start Fresh Review Session</template>
<body><main id="app"><section class="screen active"><div class="card hero" id="review-card">
<p class="eyebrow">TEAM REVIEW · NON-PRODUCTION</p><h1>AI Norm Pilot v1</h1>
<p class="subtitle">Choose one fixed cell in the 2 × 2 Norm Type × Norm Valence matrix.</p>
<table class="matrix"><thead><tr><th>Norm Type \ Norm Valence</th><th>Honest</th><th>Pro-misreport</th></tr></thead><tbody>
<tr><th>Injunctive</th><td><button class="btn btn-primary" data-condition="injunctive_honest">Review IH</button></td><td><button class="btn btn-primary" data-condition="injunctive_misreport">Review IM</button></td></tr>
<tr><th>Subjective</th><td><button class="btn btn-primary" data-condition="subjective_honest">Review SH</button></td><td><button class="btn btn-primary" data-condition="subjective_misreport">Review SM</button></td></tr>
</tbody></table><p id="result" class="status-hint"></p></div></section></main>
<script>
document.addEventListener("click", async (event) => {
  const button = event.target.closest("button[data-condition]"); if (!button) return;
  button.disabled = true; document.querySelector("#result").textContent = "Creating Team Review session...";
  try { const response = await fetch("/api/review/session", {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({peer_identity:"ai",condition:button.dataset.condition})}); const data=await response.json(); if(!response.ok) throw new Error(data.error||"Review unavailable"); location.href=`/en/?review_session=${encodeURIComponent(data.session.id)}`; }
  catch(error){ document.querySelector("#result").textContent=error.message; button.disabled=false; }
});
</script></body></html>
