<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study 1 Human-AI Team Review</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="admin-page"><section class="panel"><div class="section-kicker">Staging Team Review</div><h1>Study 1 Human-AI Peer Influence v1</h1><p>This entry creates synthetic review-only records and does not enter participant recruitment or Prolific data.</p>
<label class="field-label" for="identity">Peer identity</label><select id="identity" class="text-input"><option value="human">Human</option><option value="ai">AI</option></select>
<label class="field-label" for="condition">Active condition</label><select id="condition" class="text-input"><option value="hidden">Hidden</option><option value="honest">Honest</option><option value="dishonest_fixed_1">Fixed-1</option><option value="dishonest_fixed_2">Fixed-2</option><option value="dishonest_fixed_3">Fixed-3</option><option value="dishonest">All-Dishonest</option></select>
<button id="create" class="primary-button">Start Fresh Review Session</button><p id="result" role="status"></p></section></main>
<script>document.querySelector("#create").addEventListener("click",async()=>{const response=await fetch("/api/review/session",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({peer_identity:document.querySelector("#identity").value,condition:document.querySelector("#condition").value})});const data=await response.json();if(!response.ok){document.querySelector("#result").textContent=data.error||"Review unavailable";return;}location.href=`/en/?review_session=${encodeURIComponent(data.session.id)}`;});</script></body></html>
