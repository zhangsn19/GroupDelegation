<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Group Deception v2 管理端</title>
    <link rel="stylesheet" href="/css/style.css">
  </head>
  <body>
    <main class="admin-page">
      <section class="panel">
        <div class="section-kicker">Admin</div>
        <h1>管理端导出</h1>
        <p class="muted">输入 `ADMIN_TOKEN` 后查看计数并下载导出表。</p>
        <label class="field-label" for="admin-token">管理员 token</label>
        <input id="admin-token" class="text-input" type="password" autocomplete="off">
        <label class="consent-check"><input id="include-test" type="checkbox"><span>包含测试 / 调试数据</span></label>
        <label class="field-label" for="filter-condition">condition</label>
        <select id="filter-condition" class="text-input">
          <option value="all">全部</option>
          <option value="hidden">Hidden</option>
          <option value="honest">Honest / Fixed 0</option>
          <option value="dishonest_fixed_1">Fixed 1</option>
          <option value="dishonest_fixed_2">Fixed 2</option>
          <option value="dishonest_fixed_3">Fixed 3</option>
          <option value="dishonest">Dishonest Static / Fixed 4</option>
          <option value="dishonest_escalating">Dishonest Escalating</option>
        </select>
        <label class="field-label" for="start-date">开始日期</label>
        <input id="start-date" class="text-input" type="date">
        <label class="field-label" for="end-date">结束日期</label>
        <input id="end-date" class="text-input" type="date">
        <label class="field-label" for="record-kind">Prolific record type</label>
        <select id="record-kind" class="text-input">
          <option value="all">Formal and Preview</option>
          <option value="formal">Formal only</option>
          <option value="preview">Preview only</option>
        </select>
        <label class="field-label" for="filter-peer-identity">peer_identity / protocol</label>
        <select id="filter-peer-identity" class="text-input">
          <option value="all">All</option><option value="human">Human</option><option value="ai">AI</option><option value="human_legacy">Legacy / History</option>
        </select>
        <label class="field-label" for="record-status">Prolific status</label>
        <select id="record-status" class="text-input">
          <option value="all">All statuses</option>
          <option value="incomplete">Incomplete</option>
          <option value="completed">Completed</option>
        </select>
        <label class="consent-check"><input id="resumed-only" type="checkbox"><span>Resumed records only</span></label>
        <label class="consent-check"><input id="aliases-only" type="checkbox"><span>Session alias count greater than 1</span></label>
        <label class="field-label" for="record-conflict">Recovery flags</label>
        <select id="record-conflict" class="text-input">
          <option value="all">All records</option>
          <option value="recovery_conflict">Recovery conflict</option>
          <option value="identity_conflict">Identity conflict</option>
        </select>
        <div class="action-row">
          <button id="load-summary" class="primary-button">查看汇总</button>
        </div>
        <h2>Human-AI v1 QA Preview</h2>
        <select id="qa-peer-identity" class="text-input"><option value="human">Human</option><option value="ai">AI</option></select>
        <select id="qa-condition" class="text-input">
          <option value="hidden">Hidden</option><option value="honest">Honest</option><option value="dishonest_fixed_1">Fixed 1</option><option value="dishonest_fixed_2">Fixed 2</option><option value="dishonest_fixed_3">Fixed 3</option><option value="dishonest">All-Dishonest</option><option value="dishonest_escalating">Escalating (QA/legacy)</option>
        </select>
        <button id="create-qa" class="secondary-button">Create authenticated QA session</button>
        <pre id="qa-output" class="code-output">Default-off: ALLOW_QA_PREVIEW=false</pre>
      </section>
      <section class="panel">
        <h2>汇总</h2>
        <pre id="summary-output" class="code-output">尚未加载。</pre>
        <h2 id="formal-heading">Formal Records</h2>
        <pre id="formal-output" class="code-output">Not loaded.</pre>
        <h2 id="preview-heading">Preview Records</h2>
        <pre id="preview-output" class="code-output">Not loaded.</pre>
        <div id="export-links" class="export-grid"></div>
      </section>
    </main>
    <script>
      const tokenInput = document.querySelector("#admin-token");
      const summaryOutput = document.querySelector("#summary-output");
      const formalOutput = document.querySelector("#formal-output");
      const previewOutput = document.querySelector("#preview-output");
      const links = document.querySelector("#export-links");
      let prolificSummary = null;
      const exportsList = [
        ["JSON 原始数据", "/api/admin/export/json"],
        ["participants.csv", "/api/admin/export/participants.csv"],
        ["study1_dice_rounds.csv", "/api/admin/export/study1_dice_rounds.csv"],
        ["study2_effort_rounds.csv", "/api/admin/export/study2_effort_rounds.csv"],
        ["study2_income_reports.csv", "/api/admin/export/study2_income_reports.csv"],
        ["Download formal Prolific export bundle", "/api/admin/export/prolific-bundle.zip"],
        ["Download Preview records bundle", "/api/admin/export/prolific-preview-bundle.zip"]
        ,["Download isolated QA bundle", "/api/admin/export/qa-bundle.zip"]
      ];
      document.querySelector("#create-qa").addEventListener("click", async () => {
        const response = await fetch("/api/admin/qa/session", {
          method: "POST",
          headers: { "content-type": "application/json", "x-admin-token": tokenInput.value.trim() },
          body: JSON.stringify({ peer_identity: document.querySelector("#qa-peer-identity").value, condition: document.querySelector("#qa-condition").value })
        });
        const data = await response.json();
        document.querySelector("#qa-output").textContent = response.ok
          ? `Created ${data.session.peer_identity}/${data.session.id}. Open /en/?qa_session=${encodeURIComponent(data.session.id)}`
          : (data.error || "QA unavailable");
      });
      async function loadSummary() {
        const token = tokenInput.value.trim();
        const response = await fetch(`/api/admin/summary?${queryString()}`, {
          headers: { "x-admin-token": token }
        });
        const data = await response.json();
        const prolificResponse = await fetch(`/api/admin/prolific-summary?${queryString()}`, {
          headers: { "x-admin-token": token }
        });
        prolificSummary = await prolificResponse.json();
        summaryOutput.textContent = JSON.stringify({ current: data, preview_mode_enabled: prolificSummary.preview_mode_enabled, formal: prolificSummary.formal, preview: prolificSummary.preview }, null, 2);
        renderProlificRecords();
        links.innerHTML = exportsList.map(([label, href]) => (
          `<button class="secondary-button" data-export="${href}">${label}</button>`
        )).join("");
      }
      document.querySelector("#load-summary").addEventListener("click", loadSummary);
      ["record-kind", "record-status", "record-conflict", "resumed-only", "aliases-only"].forEach((id) => {
        document.querySelector(`#${id}`).addEventListener("change", () => {
          if (prolificSummary) loadSummary();
        });
      });
      function filterRecords(records) {
        const status = document.querySelector("#record-status").value;
        const conflict = document.querySelector("#record-conflict").value;
        return records.filter((record) => {
          if (status === "completed" && record.status !== "completed") return false;
          if (status === "incomplete" && record.status === "completed") return false;
          if (document.querySelector("#resumed-only").checked && Number(record.resume_count || 0) < 1) return false;
          if (document.querySelector("#aliases-only").checked && Number(record.session_alias_count || 0) <= 1) return false;
          if (conflict !== "all" && !(record.quality_flags || []).includes(conflict)) return false;
          return true;
        });
      }
      function renderProlificRecords() {
        if (!prolificSummary) return;
        const kind = document.querySelector("#record-kind").value;
        const formal = filterRecords(prolificSummary.participants || []);
        const preview = filterRecords(prolificSummary.preview_participants || []);
        document.querySelector("#formal-heading").hidden = kind === "preview";
        formalOutput.hidden = kind === "preview";
        formalOutput.textContent = JSON.stringify(formal, null, 2);
        document.querySelector("#preview-heading").hidden = kind === "formal";
        previewOutput.hidden = kind === "formal";
        previewOutput.textContent = JSON.stringify(preview, null, 2);
      }
      links.addEventListener("click", async (event) => {
        const button = event.target.closest("[data-export]");
        if (!button) return;
        const token = tokenInput.value.trim();
        const href = button.dataset.export;
        const response = await fetch(`${href}?${queryString()}`, {
          headers: { "x-admin-token": token }
        });
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = href.split("/").pop();
        a.click();
        URL.revokeObjectURL(url);
      });
      function queryString() {
        const params = new URLSearchParams();
        params.set("condition", document.querySelector("#filter-condition").value);
        params.set("peer_identity", document.querySelector("#filter-peer-identity").value);
        if (document.querySelector("#include-test").checked) params.set("include_test", "true");
        if (document.querySelector("#start-date").value) params.set("start_date", document.querySelector("#start-date").value);
        if (document.querySelector("#end-date").value) params.set("end_date", document.querySelector("#end-date").value);
        params.set("record_kind", document.querySelector("#record-kind").value);
        params.set("status", document.querySelector("#record-status").value);
        if (document.querySelector("#resumed-only").checked) params.set("resumed_only", "true");
        if (document.querySelector("#aliases-only").checked) params.set("aliases_only", "true");
        params.set("recovery_flag", document.querySelector("#record-conflict").value);
        return params.toString();
      }
    </script>
  </body>
</html>
