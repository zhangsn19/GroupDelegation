<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Study 1 QA Authentication</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div id="app"><section class="screen active"><div class="card hero" id="qa-login-card"><p class="eyebrow">RESEARCHER QA</p><h1>Study 1 QA Preview</h1><p class="subtitle">Authenticate to open the synthetic QA selector.</p><input id="token" class="text-input" type="password" autocomplete="current-password" aria-label="Administrator token"><div class="hero-actions"><button id="login" class="btn btn-primary btn-lg"><span class="btn-title">Authenticate</span><span class="btn-desc">Open researcher QA</span></button></div><p id="result" class="status-hint" role="alert"></p></div></section></div>
<script>if(location.protocol==="file:"){document.querySelector("#qa-login-card").innerHTML='<h1>This page must be opened through the Study1 server.</h1>';}else{document.querySelector("#login").addEventListener("click",async()=>{const response=await fetch("/api/qa/auth",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({token:document.querySelector("#token").value})});if(response.ok)location.replace("/qa-preview");else document.querySelector("#result").textContent="Authentication failed.";});}</script></body></html>
