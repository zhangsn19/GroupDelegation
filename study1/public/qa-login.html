<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study 1 QA authentication</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="admin-page"><section class="panel"><div class="section-kicker">Researcher QA</div><h1>Study 1 QA Preview</h1><p>Authenticate with the existing administrator credential to open the QA selector.</p><input id="token" class="text-input" type="password" autocomplete="current-password" aria-label="Administrator token"><button id="login" class="primary-button">Authenticate</button><p id="result" role="alert"></p></section></main>
<script>document.querySelector("#login").addEventListener("click",async()=>{const response=await fetch("/api/qa/auth",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({token:document.querySelector("#token").value})});if(response.ok)location.replace("/qa-preview");else document.querySelector("#result").textContent="Authentication failed.";});</script></body></html>
